name: PHPUnit Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, gd
          coverage: ${{ matrix.php == '8.5' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: composer test

      - name: Generate coverage report
        if: matrix.php == '8.5'
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --coverage-filter src --coverage-clover coverage.xml tests

      - name: Upload coverage report
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  coverage-badge:
    name: Publish Coverage Badge
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Generate coverage badge
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("coverage/coverage.xml").getroot()
          metrics = root.find("project/metrics")

          covered = int(metrics.attrib["coveredstatements"])
          total = int(metrics.attrib["statements"])
          percentage = round(covered / total * 100, 2) if total else 0

          color = (
              "brightgreen" if percentage >= 80
              else "yellow" if percentage >= 60
              else "red"
          )

          badge = (
              f"https://img.shields.io/badge/"
              f"coverage-{percentage:.2f}%25-{color}"
          )

          readme = Path("README.md")
          content = readme.read_text()

          start = "<!-- COVERAGE BADGE START -->"
          end = "<!-- COVERAGE BADGE END -->"

          tests_badge = (
            "[![PHPUnit Tests]"
            "(https://github.com/qstainless/QR-Generator/actions/workflows/tests.yml/badge.svg)]"
            "(https://github.com/qstainless/QR-Generator/actions/workflows/tests.yml)"
          )

          badge_block = f"{start}\n{tests_badge} ![Coverage]({badge})\n{end}"

          if start in content and end in content:
            before = content.split(start)[0]
            after = content.split(end, 1)[1]
            content = before + badge_block + after
          else:
            lines = content.splitlines()
            lines.insert(3, badge_block)
            content = "\n".join(lines) + "\n"

            readme.write_text(content)

          print(f"Line coverage: {percentage:.2f}%")
          PY

      - name: Publish coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "ci: update coverage badge [skip ci]"
            git push
          fi
